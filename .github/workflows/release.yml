name: release

# When a PR is merged to main, publish ONE GitHub release (tagged vYYYY.MM.DD) holding the
# ZIPs for every plugin and skill, if at least one plugin version has no <plugin>-v<version>
# tag yet. Merges that do not change a plugin's version publish nothing.
# Can also be run by hand from the Actions tab.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install -r scripts/requirements.txt
      - run: python scripts/validate.py
      - name: Publish a release if a plugin version is new
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/git/matching-refs/tags" --jq '.[].ref | sub("^refs/tags/"; "")' > tags.txt
          python scripts/build_release.py plan tags.txt > plan.json

          if [ "$(jq '.new_plugin_tags | length' plan.json)" = "0" ]; then
            echo "Every plugin version already has a tag; nothing to publish."
            exit 0
          fi

          tag=$(jq -r .release_tag plan.json)
          title=$(jq -r .title plan.json)
          jq -r .body plan.json > notes.md
          previous=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)

          python scripts/build_release.py build-all dist
          notes_args=()
          if [ -n "$previous" ]; then notes_args=(--notes-start-tag "$previous"); fi
          gh release create "$tag" dist/*.zip \
            --target "$TARGET_SHA" \
            --title "$title" \
            --notes-file notes.md \
            --generate-notes "${notes_args[@]}" \
            --latest
          echo "Released $tag"

          # Tag each newly released plugin version so it can be pinned (for example with
          # npx skills add owner/repo#<plugin>-v<version>) and is not released again.
          jq -r '.new_plugin_tags[]' plan.json | while read -r plugin_tag; do
            if gh api "repos/$GH_REPO/git/ref/tags/$plugin_tag" >/dev/null 2>&1; then
              echo "$plugin_tag already exists"
            else
              gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$plugin_tag" -f sha="$TARGET_SHA" >/dev/null
              echo "Tagged $plugin_tag"
            fi
          done
